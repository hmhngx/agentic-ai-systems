name: 02-chunking CI

on:
  push:
    paths:
      - "02-chunking/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "02-chunking/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-chunking

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('02-chunking/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-minilm-l6-v2-v1

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Pre-download embedding model
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Lint
        run: make lint

      - name: Fast tests
        run: make test-fast

      - name: Coverage
        run: make test-cov
