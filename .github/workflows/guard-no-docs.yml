name: Guard — no docs/

on:
  push:
  pull_request:

jobs:
  no-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if docs/ is tracked
        run: |
          tracked=$(git ls-files 'docs/')
          if [ -n "$tracked" ]; then
            echo "::error::docs/ must not be in version control."
            echo "$tracked"
            exit 1
          fi
          echo "OK: no tracked files under docs/"
